<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小小心意</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="page welcome-page">
    <div class="background-orb orb-one"></div>
    <div class="background-orb orb-two"></div>
    <div class="sparkles" aria-hidden="true"></div>
    <div class="hearts-layer" aria-hidden="true"></div>

    <main class="welcome-shell">
      <section class="card welcome-card" aria-label="欢迎界面">
        <img class="welcome-gif" src="assets/gifs/shinchan.svg" alt="可爱的Shinchan动画" />

        <h1>📩 你收到一封信，你想閱讀嗎？</h1>

        <div class="button-row" role="group" aria-label="选择按钮">
          <button id="yesBtn" class="action-btn yes-btn" type="button">是</button>
          <button id="noBtn" class="action-btn no-btn" type="button">不要</button>
        </div>
      </section>
    </main>

    <script src="js/music.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
